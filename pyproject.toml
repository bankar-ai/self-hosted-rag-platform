[project]
name = "self-hosted-rag-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "argon2-cffi>=25.1.0",
    "authlib>=1.8.0",
    "docling>=2.117.0",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "ollama>=0.6.2",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymupdf4llm>=1.28.0",
    "python-multipart>=0.0.32",
    "ragas==0.3.9",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pymupdf>=1.28.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.uv]
# ragas 0.3.9/0.4.3 both unconditionally import a langchain_community submodule
# (chat_models.vertexai) that was removed in langchain-community>=0.4 -- an upstream ragas bug
# (see github.com/explodinggradients/ragas issues #2741/#2745/#2753), unrelated to which LLM
# backend we actually use (Ollama). This is a transitive-only compatibility pin: our code never
# imports langchain_community directly, so it's a uv constraint, not a project dependency.
constraint-dependencies = ["langchain-community<0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "BLE", "PGH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D103", "D104"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "pymupdf4llm"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "faiss"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ollama"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "flashrank"
ignore_missing_imports = true
